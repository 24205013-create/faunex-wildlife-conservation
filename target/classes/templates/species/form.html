<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="mb-6">
            <a th:href="@{/species}" class="text-green-700 font-bold text-sm"><i class="fas fa-arrow-left mr-1"></i> BACK TO LIST</a>
            <h1 class="text-2xl font-bold text-gray-800 mt-2" th:text="${species.speciesId == null ? 'Add New Species' : 'Edit Species'}">Add Species</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 max-w-2xl overflow-hidden">
            <form th:action="@{/species/save}" th:object="${species}" method="post" class="p-8 space-y-6">
                <input type="hidden" th:field="*{speciesId}">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Common Name</label>
                        <input type="text" th:field="*{commonName}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. African Lion" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Scientific Name</label>
                        <input type="text" th:field="*{scientificName}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. Panthera leo">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Conservation Status</label>
                        <select th:field="*{conservationStatus}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                            <option value="Least Concern">Least Concern</option>
                            <option value="Near Threatened">Near Threatened</option>
                            <option value="Vulnerable">Vulnerable</option>
                            <option value="Endangered">Endangered</option>
                            <option value="Critically Endangered">Critically Endangered</option>
                            <option value="Extinct in the Wild">Extinct in the Wild</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Avg Lifespan (Years)</label>
                        <input type="number" th:field="*{avgLifespan}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Diet Status</label>
                    <input type="text" th:field="*{dietStatus}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. Carnivore">
                </div>

                <div class="pt-4 border-t border-gray-50 flex justify-end">
                    <button type="submit" class="px-8 py-3 bg-green-700 text-white font-bold rounded-xl shadow-lg hover:bg-green-800 transition-all">
                        SAVE SPECIES
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
