<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="mb-6 text-2xl font-bold text-gray-800">
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Ranger Profile Form</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 max-w-2xl overflow-hidden">
            <form th:action="@{/rangers/save}" th:object="${ranger}" method="post" class="p-8 space-y-6">
                <input type="hidden" th:field="*{rangerId}">
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Full Name</label>
                    <input type="text" th:field="*{name}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Phone Number</label>
                        <input type="text" th:field="*{phone}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Rank / Designation</label>
                        <input type="text" th:field="*{rangerRank}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none" placeholder="e.g. Lead Guardian">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Join Date</label>
                        <input type="date" th:field="*{joinDate}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none">
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-50 flex justify-end">
                    <button type="submit" class="px-8 py-3 bg-green-700 text-white font-bold rounded-xl shadow-lg hover:bg-green-800 transition-colors">
                        SAVE PROFILE
                    </button>
                    <a th:href="@{/rangers}" class="ml-4 px-8 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">
                        CANCEL
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
