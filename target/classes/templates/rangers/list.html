<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Ranger Directory</h1>
            <a th:href="@{/rangers/add}" class="px-4 py-2 bg-green-700 text-white rounded-lg font-bold shadow-md hover:bg-green-800 transition-colors">
                <i class="fas fa-plus mr-2"></i> NEW RANGER
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="ranger : ${rangers}" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-green-100 text-green-700 rounded-full flex items-center justify-center font-bold text-2xl mb-4">
                    <span th:text="${ranger != null && ranger.name != null && !ranger.name.isEmpty() ? #strings.substring(ranger.name, 0, 1) : 'R'}">R</span>
                </div>
                <h3 class="text-lg font-bold text-gray-800" th:text="${ranger.name}">Ranger John Doe</h3>
                <p class="text-xs font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full mt-2" th:text="${ranger.rangerRank}">Senior Ranger</p>
                
                <div class="mt-6 w-full space-y-2 text-sm text-left border-t border-gray-50 pt-4">
                    <p class="text-gray-500"><i class="fas fa-phone mr-2 w-4"></i> <span th:text="${ranger.phone}">+1 234 567</span></p>
                    <p class="text-gray-500"><i class="fas fa-calendar-alt mr-2 w-4"></i> Joined: <span th:text="${ranger.joinDate}">2024-01-01</span></p>
                </div>

                <div class="mt-6 flex space-x-2 w-full">
                    <a th:href="@{/rangers/edit/{id}(id=${ranger.rangerId})}" class="flex-grow py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold hover:bg-gray-200 transition-colors">EDIT</a>
                    <a th:href="@{/rangers/delete/{id}(id=${ranger.rangerId})}" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" onclick="return confirm('Delete this ranger?')"><i class="fas fa-trash"></i></a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
