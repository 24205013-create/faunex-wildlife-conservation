<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="mb-6">
            <a th:href="@{/habitats}" class="text-green-700 font-bold text-sm"><i class="fas fa-arrow-left mr-1"></i> BACK TO LIST</a>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Habitat Form</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 max-w-2xl overflow-hidden">
            <form th:action="@{/habitats/save}" th:object="${habitat}" method="post" class="p-8 space-y-6">
                <input type="hidden" th:field="*{habitatId}">
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Habitat Name</label>
                    <input type="text" th:field="*{habitatName}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Location</label>
                        <input type="text" th:field="*{location}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Area Size (km²)</label>
                        <input type="number" step="0.1" th:field="*{areaSize}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Climate Type</label>
                        <input type="text" th:field="*{climateType}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Protection Level</label>
                        <select th:field="*{protectionLevel}" class="w-full px-4 py-2 border border-gray-200 rounded-lg outline-none">
                            <option value="Standard">Standard</option>
                            <option value="High">High</option>
                            <option value="Restricted">Restricted</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-50 flex justify-end">
                    <button type="submit" class="px-8 py-3 bg-green-700 text-white font-bold rounded-xl shadow-lg">
                        SAVE HABITAT
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
