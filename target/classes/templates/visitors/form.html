<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="mb-6">
            <a th:href="@{/visitors}" class="text-green-700 font-bold text-sm"><i class="fas fa-arrow-left mr-1"></i> BACK TO DIRECTORY</a>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">Visitor Profile</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 max-w-xl overflow-hidden">
            <form th:action="@{/visitors/save}" th:object="${visitor}" method="post" class="p-8 space-y-6">
                <input type="hidden" th:field="*{visitorId}">
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Visitor Name</label>
                    <input type="text" th:field="*{name}" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-green-500 transition-all" required>
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Contact Details (Email/Phone)</label>
                    <input type="text" th:field="*{contact}" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-green-500 transition-all">
                </div>

                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Purpose of Visit</label>
                    <input type="text" th:field="*{purpose}" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-green-500 transition-all" placeholder="e.g. Education, Research, Tourism">
                </div>

                <div class="pt-6 border-t border-gray-50 flex justify-end">
                    <button type="submit" class="px-10 py-3 bg-green-700 text-white font-bold rounded-xl shadow-lg hover:bg-green-800 transition-all">
                        SAVE VISITOR
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
