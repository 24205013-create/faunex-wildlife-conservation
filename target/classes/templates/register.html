<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Faunex</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 flex items-center justify-center min-h-screen py-10">
    <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md border-t-8 border-green-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-green-900 tracking-tight">FAUNEX</h1>
            <p class="text-green-600 font-medium mt-2">Create your conservationist profile</p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Full Name</label>
                <input type="text" th:field="*{fullName}" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Username</label>
                <input type="text" th:field="*{username}" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Email</label>
                <input type="email" th:field="*{email}" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Password</label>
                <input type="password" th:field="*{password}" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none" required>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1 ml-1">Your Role</label>
                <select th:field="*{role}" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 outline-none cursor-pointer">
                    <option value="VISITOR">Visitor (General Public)</option>
                    <option value="RANGER">Ranger (Field Staff)</option>
                    <option value="ADMIN">Administrator</option>
                </select>
            </div>
            
            <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white font-bold py-3.5 rounded-xl shadow-lg mt-4 transition-all">
                CREATE ACCOUNT
            </button>
        </form>
        
        <p class="mt-6 text-center text-gray-500 text-sm">
            Already have an account? 
            <a th:href="@{/login}" class="text-green-700 font-bold hover:underline">Sign In</a>
        </p>
    </div>
</body>
</html>
