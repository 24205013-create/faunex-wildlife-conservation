<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <h1 class="text-2xl font-bold mb-6">Schedule Visit Session</h1>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 max-w-2xl overflow-hidden">
            <form th:action="@{/visits/save}" th:object="${visit}" method="post" class="p-8 space-y-6">
                <div th:if="${!isVisitorUser}">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Select Visitor</label>
                    <select th:field="*{visitor.visitorId}" class="w-full px-4 py-2 border border-blue-100 rounded-lg outline-none">
                        <option th:each="v : ${visitors}" th:value="${v.visitorId}" th:text="${v.name}"></option>
                    </select>
                </div>
                <div th:if="${isVisitorUser}">
                    <input type="hidden" th:field="*{visitor.visitorId}">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Visitor Profile</label>
                    <div class="px-4 py-2 bg-gray-50 border border-gray-100 rounded-lg text-gray-500 italic" th:text="${visit.visitor != null ? visit.visitor.name : 'Your profile'}">Your Name</div>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Target Habitat</label>
                    <select th:field="*{habitat.habitatId}" class="w-full px-4 py-2 border border-blue-100 rounded-lg outline-none">
                        <option th:each="h : ${habitats}" th:value="${h.habitatId}" th:text="${h.habitatName}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Date & Time</label>
                    <input type="datetime-local" th:field="*{visitDate}" class="w-full px-4 py-2 border border-gray-100 rounded-lg outline-none">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Special Remarks</label>
                    <textarea th:field="*{remarks}" class="w-full px-4 py-2 border border-gray-100 rounded-lg outline-none" rows="3"></textarea>
                </div>

                <div class="pt-4 border-t border-gray-50 flex justify-end">
                    <button type="submit" class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg">CONFIRM VISIT</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
