<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faunex - Wildlife Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar-link:hover { background-color: rgba(255,255,255,0.1); }
        .active-link { background-color: rgba(255,255,255,0.2); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Sidebar Fragment -->
    <div th:fragment="sidebar" class="fixed left-0 top-0 h-full w-64 bg-green-800 text-white shadow-xl flex flex-col">
        <div class="p-6 text-center border-b border-green-700">
            <h1 class="text-2xl font-bold tracking-wider">FAUNEX</h1>
            <p class="text-xs text-green-200 mt-1">Wildlife Hub</p>
        </div>
        
        <nav class="flex-grow mt-6 px-4 space-y-2">
            <a th:href="@{/dashboard}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors active-link">
                <i class="fas fa-home w-8"></i> Dashboard
            </a>
            
            <div sec:authorize="hasRole('ADMIN')">
                <p class="px-3 py-2 text-xs font-semibold text-green-300 uppercase">Management</p>
                <a th:href="@{/species}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors">
                    <i class="fas fa-leaf w-8"></i> Species
                </a>
                <a th:href="@{/animals}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors">
                    <i class="fas fa-paw w-8"></i> Animals
                </a>
                <a th:href="@{/habitats}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors">
                    <i class="fas fa-mountain-sun w-8"></i> Habitats
                </a>
                <a th:href="@{/rangers}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors">
                    <i class="fas fa-user-shield w-8"></i> Rangers
                </a>
                <a th:href="@{/visitors}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors">
                    <i class="fas fa-users w-8"></i> Visitors
                </a>
            </div>

            <div sec:authorize="hasAnyRole('ADMIN', 'RANGER')">
                <p class="px-3 py-2 text-xs font-semibold text-green-300 uppercase">Operations</p>
                <a th:href="@{/incidents}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors">
                    <i class="fas fa-exclamation-triangle w-8"></i> Incidents
                </a>
            </div>

            <div sec:authorize="hasAnyRole('ADMIN', 'VISITOR')">
                <p class="px-3 py-2 text-xs font-semibold text-green-300 uppercase">Records</p>
                <a th:href="@{/visits}" class="flex items-center p-3 sidebar-link rounded-lg transition-colors">
                    <i class="fas fa-calendar-check w-8"></i> Visit Records
                </a>
            </div>
        </nav>
        
        <div class="p-6 border-top border-green-700">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full flex items-center p-3 text-red-200 hover:text-white hover:bg-red-900/40 rounded-lg transition-colors">
                    <i class="fas fa-sign-out-alt w-8"></i> Logout
                </button>
            </form>
        </div>
    </div>

</body>
</html>
