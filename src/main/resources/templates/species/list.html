<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Species Management</h1>
            <a th:href="@{/species/add}" class="px-4 py-2 bg-green-700 text-white rounded-lg font-bold shadow-md hover:bg-green-800 transition-colors">
                <i class="fas fa-plus mr-2"></i> ADD SPECIES
            </a>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-100">
                    <tr class="text-xs font-bold text-gray-500 uppercase">
                        <th class="px-6 py-4">Common Name</th>
                        <th class="px-6 py-4">Scientific Name</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Lifespan (Avg)</th>
                        <th class="px-6 py-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                    <tr th:each="species : ${speciesList}" class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 font-semibold text-gray-800" th:text="${species.commonName}">Lion</td>
                        <td class="px-6 py-4 text-gray-600 italic" th:text="${species.scientificName}">Panthera leo</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 bg-red-100 text-red-700 text-xs font-bold rounded" th:text="${species.conservationStatus}">Vulnerable</span>
                        </td>
                        <td class="px-6 py-4 text-gray-600" th:text="${species.avgLifespan != null ? species.avgLifespan + ' years' : 'N/A'}">15 years</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <a th:href="@{/species/edit/{id}(id=${species.speciesId})}" class="text-blue-600 hover:text-blue-800"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/species/delete/{id}(id=${species.speciesId})}" class="text-red-600 hover:text-red-800" onclick="return confirm('Are you sure?')"><i class="fas fa-trash"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
