<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - Faunex</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center">
        <div class="text-red-500 text-5xl mb-4">
            <i class="fas fa-exclamation-circle"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Oops! Something went wrong</h1>
        <p class="text-gray-600 mb-2" th:text="${'Status: ' + status}">Status</p>
        <p class="text-gray-600 mb-2" th:text="${'Path: ' + path}">Path</p>
        <p class="text-gray-600 mb-6" th:text="${message}">Error detail...</p>
        
        <div class="text-left bg-gray-50 p-4 rounded-lg overflow-auto max-h-64 mb-6">
            <pre class="text-xs text-red-700" th:text="${exception}"></pre>
        </div>
        
        <a href="/dashboard" class="inline-block bg-green-700 text-white px-6 py-2 rounded-lg font-bold">Return to Dashboard</a>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
