<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <h1 class="text-2xl font-bold mb-6">Scheduled Visits</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div th:each="visit : ${visits}" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 relative">
                <div class="flex items-center space-x-4">
                    <div class="bg-blue-100 text-blue-600 p-4 rounded-xl font-bold">
                        <span th:text="${visit.visitDate != null ? #temporals.format(visit.visitDate, 'dd') : '??'}">01</span>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800" th:text="${visit.visitor?.name}">Visitor Name</h3>
                        <p class="text-sm text-gray-500">Visit to: <span class="text-green-700 font-bold" th:text="${visit.habitat?.habitatName}">Habitat</span></p>
                    </div>
                </div>
                <p class="mt-4 text-xs text-gray-400 italic" th:text="${visit.remarks}">No remarks.</p>
                <a th:href="@{/visits/delete/{id}(id=${visit.visitId})}" class="absolute top-4 right-4 text-red-300 hover:text-red-500"><i class="fas fa-times"></i></a>
            </div>
            
            <a th:href="@{/visits/add}" class="bg-dashed border-2 border-dashed border-gray-200 p-6 rounded-2xl flex flex-col items-center justify-center text-gray-400 hover:border-green-300 hover:text-green-600 transition-all">
                <i class="fas fa-plus-circle text-2xl mb-2"></i>
                <span class="font-bold">SCHEDULE NEW VISIT</span>
            </a>
        </div>
    </main>
</body>
</html>
