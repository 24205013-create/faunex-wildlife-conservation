<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Habitat Management</h1>
            <a th:href="@{/habitats/add}" class="px-4 py-2 bg-green-700 text-white rounded-lg font-bold shadow-md hover:bg-green-800 transition-colors">
                <i class="fas fa-plus mr-2"></i> ADD HABITAT
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="habitat : ${habitats}" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow">
                <div class="h-3 bg-green-700"></div>
                <div class="p-6">
                    <div class="flex justify-between items-start">
                        <h3 class="text-xl font-bold text-gray-800" th:text="${habitat.habitatName}">Savannah Zone</h3>
                        <div class="space-x-1">
                            <a th:href="@{/habitats/edit/{id}(id=${habitat.habitatId})}" class="text-blue-500"><i class="fas fa-edit"></i></a>
                            <a th:href="@{/habitats/delete/{id}(id=${habitat.habitatId})}" class="text-red-500"><i class="fas fa-trash"></i></a>
                        </div>
                    </div>
                    <p class="text-sm text-gray-400 mt-1"><i class="fas fa-map-marker-alt mr-1"></i> <span th:text="${habitat.location}">East Sector</span></p>
                    
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Size</p>
                            <p class="text-sm font-bold text-gray-700" th:text="${habitat.areaSize + ' km²'}">50 km²</p>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                            <p class="text-[10px] font-bold text-gray-400 uppercase">Climate</p>
                            <p class="text-sm font-bold text-gray-700" th:text="${habitat.climateType}">Tropical</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
