<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-gray-100 min-h-screen">
    <div th:replace="~{layout :: sidebar}"></div>
    <main class="ml-64 p-8">
        <div class="mb-6">
            <a th:href="@{/animals}" class="text-green-700 font-bold text-sm"><i class="fas fa-arrow-left mr-1"></i> BACK TO LIST</a>
            <h1 class="text-2xl font-bold text-gray-800 mt-2" th:text="${animal.animalId == null ? 'Register New Animal' : 'Edit Animal'}">Animal Form</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-gray-100 max-w-2xl overflow-hidden">
            <form th:action="@{/animals/save}" th:object="${animal}" method="post" class="p-8 space-y-6">
                <input type="hidden" th:field="*{animalId}">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Name</label>
                        <input type="text" th:field="*{name}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Tag Number</label>
                        <input type="text" th:field="*{tagNumber}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="Leave blank to auto-generate">
                        <p class="text-xs text-gray-400 mt-1" th:if="${animal.animalId == null}">* Will be auto-generated if empty (e.g. TAG-XXXXX)</p>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Species</label>
                        <select th:field="*{species.speciesId}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                            <option value="">Select Species</option>
                            <option th:each="s : ${speciesList}" th:value="${s.speciesId}" th:text="${s.commonName}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Habitat</label>
                        <select th:field="*{habitat.habitatId}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                            <option value="">Select Habitat</option>
                            <option th:each="h : ${habitats}" th:value="${h.habitatId}" th:text="${h.habitatName}"></option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Gender</label>
                        <select th:field="*{gender}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-bold mb-2">Age</label>
                        <input type="number" th:field="*{age}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Health Status</label>
                    <input type="text" th:field="*{healthStatus}" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. Good, Injured, Under Observation">
                </div>

                <div class="pt-4 border-t border-gray-50 flex justify-end">
                    <button type="submit" class="px-8 py-3 bg-green-700 text-white font-bold rounded-xl shadow-lg hover:bg-green-800 transition-all">
                        SAVE ANIMAL
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
